name: Public bootstrap quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-scope-and-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exercise publication contract and CLI offline
        run: python3 -m unittest discover -s tests/public -p 'test_*.py' -v
      - name: Check the actual tracked publication surface
        run: python3 tools/check_public_tree.py
